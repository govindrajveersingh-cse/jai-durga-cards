<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact-Jai Durga Cards</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .contact{
            margin-top: 100px;
            padding: 50px;
            text-align: center;
        }

        .contact-container{
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px raba(0,0,0,.2);
        }

        .contact-container input,
        .contact-container textarea{
            width: 100px;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .contact-container button{
            width:100%;
            padding: 12px;
            background: #800000;
            color: white;
            border: none;border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        .contact-container button:hover{
            background: #a00000;
        }

        .info{
            margin-bottom: 30px;
            line-height:2;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">JAI DURGA CARDS</div>
        <nav>
             <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="gallery.html">Gallery</a>
            <a href="pricing.html">Pricing</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="contact">
        <h2>Contact Us</h2>
        <div class="contact-container">

            <div class="info">
                <p>🏢Luharu Bus stand Station Road,Sikar,Rajasthan(332402)</p>
                <p>📞+91 9602275083 </p>
                <p>📧jeetusikar8595@gmail.com</p>
            </div>

            <form>
                <input type="text" placeholder="Your Name"required>

                <input type="email" placeholder="Your Email"required>

                <input type="tel" placeholder="Mobile Number"required>

                <textarea rows="5" placeholder="Your Message"></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>

    <footer>
        <p>©️2026 Jai Durga Cards|All Rights Reserved</p>
    </footer>
</body>
</html>
